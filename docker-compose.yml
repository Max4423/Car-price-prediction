version: "3.8"
services:
    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        container_name: predicting-backend
        env_file:
            - backend/.env
        ports:
            - "5000:5000"
        volumes:
            - ./data:/app/data:ro
        restart: unless-stopped

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
        container_name: predicting-frontend
        env_file:
            - frontend/.env
        ports:
            - "8501:8501"
        volumes:
            - ./data:/app/data:ro
        environment:
            - API_URL=http://backend:5000
        depends_on:
            - backend
        restart: unless-stopped
